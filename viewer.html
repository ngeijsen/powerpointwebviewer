</div><!-- /appWrapper -->

  <script>
    const APP_VERSION = '1.16.0';
    const HINT_DELAY_MS = 2500;     // wait before offering "Open in window"
    const HINT_DURATION_MS = 15000; // then hide it again

    const urlInput = document.getElementById('urlInput');
    const webFrame = document.getElementById('webFrame');
    const overlay = document.getElementById('overlay');
    const loading = document.getElementById('loading');
    const config = document.getElementById('config');
    const cornerZone = document.getElementById('cornerZone');
    const branding = document.getElementById('branding');
    const envBadge = document.getElementById('envBadge');
    const appWrapper = document.getElementById('appWrapper');
    const hint = document.getElementById('hint');

    let controlsVisible = true;
    let isOnline = false;        // true if running in PowerPoint Online
    let officeReady = false;
    let currentPageUrl = '';     // the URL the user entered (used for "Open in Window")
    let currentUrl = '';         // the URL loaded in the frame (YouTube/Vimeo become embed URLs)
    let loadTimeoutId = null;
    let hintShowTimer = null;
    let hintHideTimer = null;
    let activeDialog = null;

    // ─── Desktop zoom (virtual 1600px-wide screen) ────────
    const ZOOM_WIDTH = 1600;
    const btnZoom = document.getElementById('btnZoom');
    let zoomEnabled = true;      // on by default; saved per slide as 'webViewerZoom'

    function applyZoom() {
      appWrapper.classList.toggle('zoomed', zoomEnabled);
      btnZoom.classList.toggle('active', zoomEnabled);
      btnZoom.setAttribute('aria-pressed', zoomEnabled ? 'true' : 'false');

      if (!zoomEnabled) {
        webFrame.style.width = '';
        webFrame.style.height = '';
        webFrame.style.transform = '';
        document.documentElement.style.setProperty('--s', '1');
        return;
      }

      var boxW = appWrapper.clientWidth;
      var boxH = appWrapper.clientHeight;
      if (!boxW || !boxH) return;

      // Lay the site out 1600px wide and scale it to the box width. The
      // height follows the box shape (900px in a 16:9 box), so the site
      // always fills the box edge to edge, with no bars around it.
      var scale = boxW / ZOOM_WIDTH;
      // The controls are sized like the website's own menu text, which is
      // drawn at this same scale (see --s in the theme)
      document.documentElement.style.setProperty('--s', String(scale));

      webFrame.style.width = ZOOM_WIDTH + 'px';
      webFrame.style.height = (boxH / scale) + 'px';
      webFrame.style.transform = 'scale(' + scale + ')';
    }

    function toggleZoom() {
      zoomEnabled = !zoomEnabled;
      applyZoom();
      saveSetting('webViewerZoom', zoomEnabled ? 'desktop' : 'native');
    }

    if (window.ResizeObserver) {
      new ResizeObserver(applyZoom).observe(appWrapper);
    }
    window.addEventListener('resize', applyZoom);
    applyZoom();

    // ─── Movable control bar ──────────────────────────────
    // Drag the controls by the grip on their left end, so they never sit on
    // top of a button of the website. The position is saved per slide, as a
    // fraction of the box so it survives resizing. Double-click the grip to
    // send them back to the top-right corner. The ⚙ that brings hidden
    // controls back always stays in the top-right corner.
    var barGrip = document.getElementById('barGrip');
    var barPos = null;           // full bar: { x, y } fractions of the box, or null = top-right corner
    var barPosSmall = null;      // small bar (also while it waits during a slideshow): its own place,
                                 // null = top-right corner, so making the bar small sends it there

    function barIsSmall() { return config.classList.contains('compact') || config.classList.contains('peek'); }
    function curBarPos() { return barIsSmall() ? barPosSmall : barPos; }
    function setCurBarPos(p) { if (barIsSmall()) barPosSmall = p; else barPos = p; }
    function saveCurBarPos() {
      var p = curBarPos();
      saveSetting(barIsSmall() ? 'webViewerBarPosSmall' : 'webViewerBarPos', p ? JSON.stringify(p) : null);
    }

    function placeBar() {
      var pos = curBarPos();
      if (!pos) {
        config.style.left = config.style.top = config.style.right = '';
        return;
      }
      var W = appWrapper.clientWidth, H = appWrapper.clientHeight;
      var x = Math.min(Math.max(0, pos.x * W), Math.max(0, W - config.offsetWidth));
      var y = Math.min(Math.max(0, pos.y * H), Math.max(0, H - config.offsetHeight));
      config.style.left = x + 'px';
      config.style.top = y + 'px';
      config.style.right = 'auto';
    }

    function restoreBarPos(value, small) {
      var p = null;
      try {
        var v = typeof value === 'string' ? JSON.parse(value) : null;
        if (v && isFinite(v.x) && isFinite(v.y) && v.x >= 0 && v.x <= 1 && v.y >= 0 && v.y <= 1) p = { x: Number(v.x), y: Number(v.y) };
      } catch (e) { p = null; }
      if (small) barPosSmall = p; else barPos = p;
      placeBar();
    }

    barGrip.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      e.preventDefault();
      var start = config.getBoundingClientRect();
      var box = appWrapper.getBoundingClientRect();
      var dx = e.clientX - start.left, dy = e.clientY - start.top;
      try { barGrip.setPointerCapture(e.pointerId); } catch (err) { /* older hosts */ }
      document.body.classList.add('dragging-bar');

      function move(ev) {
        setCurBarPos({
          x: (ev.clientX - box.left - dx) / appWrapper.clientWidth,
          y: (ev.clientY - box.top - dy) / appWrapper.clientHeight
        });
        placeBar();
      }
      function end() {
        barGrip.removeEventListener('pointermove', move);
        barGrip.removeEventListener('pointerup', end);
        barGrip.removeEventListener('pointercancel', end);
        document.body.classList.remove('dragging-bar');
        if (curBarPos()) {
          // store the clamped position actually shown
          setCurBarPos({ x: config.offsetLeft / appWrapper.clientWidth, y: config.offsetTop / appWrapper.clientHeight });
          saveCurBarPos();
        }
      }
      barGrip.addEventListener('pointermove', move);
      barGrip.addEventListener('pointerup', end);
      barGrip.addEventListener('pointercancel', end);
    });

    barGrip.addEventListener('dblclick', function () {
      setCurBarPos(null);
      placeBar();
      saveCurBarPos();
    });

    if (window.ResizeObserver) new ResizeObserver(placeBar).observe(appWrapper);
    window.addEventListener('resize', placeBar);

    // ─── Detect environment ───────────────────────────────
    function detectEnvironment() {
      try {
        // Office.context.platform: 'OfficeOnline', 'PC', 'Mac', 'iOS', 'Android'
        const platform = Office.context.platform;
        if (platform === Office.PlatformType.OfficeOnline) {
          isOnline = true;
          envBadge.textContent = 'POWERPOINT ONLINE';
          envBadge.className = 'online';
        } else {
          isOnline = false;
          envBadge.textContent = 'DESKTOP';
          envBadge.className = 'desktop';
        }
      } catch (e) {
        // If Office API not available, assume standalone/testing
        envBadge.textContent = 'STANDALONE';
        envBadge.className = 'desktop';
      }
    }

    // ─── Small DOM helpers ────────────────────────────────
    // Messages are built with DOM nodes (not innerHTML) so a URL can never
    // be interpreted as HTML.
    function make(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }

    function makeButton(label, className, onClick) {
      var b = make('button', className, label);
      b.addEventListener('click', onClick);
      return b;
    }

    function makeTip(html) {
      // Only ever called with fixed text written in this file
      var tip = make('div', 'tip');
      tip.innerHTML = html;
      return tip;
    }

    function resetOverlay() {
      overlay.textContent = '';
      overlay.classList.remove('hidden');
      loading.classList.remove('active');
      hideHint();
    }

    // ─── Show error in overlay ────────────────────────────
    function showError(title, message, showButtons) {
      resetOverlay();
      overlay.appendChild(make('div', 'emoji', '⚠️'));
      overlay.appendChild(make('h2', null, title));
      overlay.appendChild(make('p', null, message));

      if (showButtons && currentUrl) {
        var row = make('div', 'btn-row');
        row.appendChild(makeButton('Open in Window', 'overlay-btn', openInDialog));
        row.appendChild(makeButton('Retry in Frame', 'overlay-btn secondary', retryLoad));
        overlay.appendChild(row);
        if (isOnline) {
          overlay.appendChild(makeTip('<strong>Tip:</strong> In PowerPoint Online, many websites block being embedded in frames. Use <strong>"Open in Window"</strong> to view the site in a separate browser window, or try <strong>"Window"</strong> button in the toolbar.'));
        }
      }
    }

    // ─── Show a clickable link when a window could not be opened ──
    function showOpenLink(url) {
      resetOverlay();
      overlay.appendChild(make('div', 'emoji', '🔗'));
      overlay.appendChild(make('h2', null, 'Open the website'));
      overlay.appendChild(make('p', null, 'The window could not be opened automatically (it may have been blocked). Click the link below to open the website:'));

      var link = make('a', 'overlay-link', url);
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      overlay.appendChild(link);

      if (currentUrl) {
        var row = make('div', 'btn-row');
        row.appendChild(makeButton('Back to slide', 'overlay-btn secondary', function () {
          overlay.classList.add('hidden');
        }));
        overlay.appendChild(row);
      }
    }

    // ─── Show welcome screen ──────────────────────────────
    function showWelcome() {
      resetOverlay();
      overlay.appendChild(make('div', 'emoji', '🌐'));
      overlay.appendChild(make('h2', null, 'Live Website Viewer'));

      var intro = make('p');
      intro.innerHTML = 'Type a website address above and press <strong>Enter</strong> to show it inside this slide.';
      overlay.appendChild(intro);
      overlay.appendChild(make('p', 'welcome-tip', '💡 Tip: paste a YouTube or Vimeo link to embed a video.'));

      if (isOnline) {
        overlay.appendChild(makeTip('<strong>PowerPoint Online detected:</strong> Some websites may not display inside the frame. If a site does not load, use the <strong>"Window"</strong> button to open it in a separate browser window.'));
      }

      var credit = make('div', 'credit');
      credit.innerHTML = 'Created by <strong>Pedro Hernandez</strong> &mdash; PeopleWorks Services &middot; v' + APP_VERSION;
      if (reportedView) credit.appendChild(document.createTextNode(' \u00b7 PowerPoint view: ' + reportedView));
      overlay.appendChild(credit);
    }

    // ─── "Site not showing?" hint ─────────────────────────
    // Browsers do not tell the page when a site refuses to be framed
    // (X-Frame-Options / frame-ancestors): the frame just shows an error page.
    // So after every load we briefly offer to open the site in a window.
    function scheduleHint() {
      hideHint();
      // YouTube / Vimeo embed players always allow framing — no hint needed
      if (currentUrl !== currentPageUrl) return;
      hintShowTimer = setTimeout(function () {
        if (!controlsVisible || !currentUrl || !overlay.classList.contains('hidden')) return;
        hint.classList.add('visible');
        hintHideTimer = setTimeout(hideHint, HINT_DURATION_MS);
      }, HINT_DELAY_MS);
    }

    function hideHint() {
      clearTimeout(hintShowTimer);
      clearTimeout(hintHideTimer);
      hint.classList.remove('visible');
    }

    // ─── Show / hide controls ─────────────────────────────
    function setControlsVisible(visible) {
      controlsVisible = visible;
      config.classList.remove('hidden');
      config.classList.toggle('peek', !visible);           // small and see-through until pointed at
      cornerZone.classList.toggle('visible', !visible);    // invisible area in the top-right corner
      if (visible) {
        envBadge.classList.remove('hidden');
        // Show branding only if no website is loaded
        if (!currentUrl) branding.classList.remove('hidden');
      } else {
        envBadge.classList.add('hidden');
        branding.classList.add('hidden');
        document.body.classList.remove('corner-peek');
        closePointerMenu();
        hideHint();
      }
      placeBar();
    }

    // Pointing at the top-right corner (or moving over the bar) shows the waiting
    // bar; it fades a few seconds after the pointer stops moving there. A timer
    // is used because the browser does not always report the pointer leaving
    // towards the website.
    var peekTimer = null;
    function endPeek(delay) {
      clearTimeout(peekTimer);
      peekTimer = setTimeout(function () {
        if (!pointerMenu.hidden || document.body.classList.contains('dragging-bar')) { endPeek(1000); return; }
        document.body.classList.remove('corner-peek');
      }, delay);
    }
    function peekNow() {
      if (controlsVisible) return;
      document.body.classList.add('corner-peek');
      endPeek(3000);
    }
    ['mouseenter', 'mousemove', 'pointerdown'].forEach(function (t) {
      cornerZone.addEventListener(t, peekNow);
      config.addEventListener(t, peekNow);
    });
    cornerZone.addEventListener('mouseleave', function () { if (!controlsVisible) endPeek(1200); });
    config.addEventListener('mouseleave', function () { if (!controlsVisible) endPeek(800); });

    // × : while presenting the bar goes back to waiting; otherwise it becomes small
    function shrinkBar() {
      if (presenting) { setControlsVisible(false); autoHidden = true; }
      else setCompact(true);
    }

    // ↗ : the full bar
    function expandBar() {
      if (!controlsVisible) { autoHidden = false; setControlsVisible(true); }
      setCompact(false);
    }

    function toggleControls() {
      setControlsVisible(!controlsVisible);
    }

    // ─── Smaller controls ─────────────────────────────────
    // The × no longer hides the bar: it shrinks it to the move button, back /
    // forward, the pointer picker and a button to show everything again.
    // Remembered per slide, like where the bar was dragged to.
    var compact = false;
    function setCompact(on, noSave) {
      compact = !!on;
      config.classList.toggle('compact', compact);
      if (compact) {
        if (textOn) setTextOn(false);       // its T button is not in the small bar
        closePointerMenu();
        hideHint();
      }
      placeBar();
      if (!noSave) saveSetting('webViewerCompact', compact ? true : null);
    }

    // ─── Load the current URL into the frame ──────────────
    function setCurrentUrl(pageUrl) {
      currentPageUrl = pageUrl;
      currentUrl = UrlTools.toEmbedUrl(pageUrl);
    }

    function startFrameLoad() {
      hideHint();
      overlay.classList.add('hidden');
      branding.classList.add('hidden');
      loading.classList.add('active');
      webFrame.src = currentUrl;
      startLoadTimeout();
    }

    // ─── Reload the current page ──────────────────────────
    function reloadFrame() {
      if (!currentUrl) {
        showWelcome();
        return;
      }
      startFrameLoad();
    }

    // ─── Retry loading in iframe ──────────────────────────
    function retryLoad() {
      if (currentUrl) startFrameLoad();
    }

    // ─── Fullscreen toggle ────────────────────────────────
    function toggleFullscreen() {
      var fsElement = document.fullscreenElement || document.webkitFullscreenElement;
      if (fsElement) {
        var exitFs = document.exitFullscreen || document.webkitExitFullscreen;
        if (exitFs) exitFs.call(document);
        return;
      }
      var requestFs = appWrapper.requestFullscreen || appWrapper.webkitRequestFullscreen;
      if (requestFs) {
        try {
          var result = requestFs.call(appWrapper);
          if (result && typeof result.catch === 'function') {
            // Fullscreen blocked (common inside Office) — fall back to a clean view
            result.catch(function () { setControlsVisible(false); });
          }
        } catch (e) {
          setControlsVisible(false);
        }
      } else {
        setControlsVisible(false);
      }
    }

    function onFullscreenChange() {
      var active = !!(document.fullscreenElement || document.webkitFullscreenElement);
      setControlsVisible(!active);
    }
    document.addEventListener('fullscreenchange', onFullscreenChange);
    document.addEventListener('webkitfullscreenchange', onFullscreenChange);

    // ─── Open URL in a separate window ────────────────────
    // Office's Dialog API only opens pages on the add-in's own domain, so we
    // open dialog.html (same domain), which then redirects to the website.
    function openInDialog() {
      var typed = urlInput.value.trim();
      var url = typed ? UrlTools.safeUrl(typed) : currentPageUrl;

      if (!typed && !url) {
        showError('Empty URL', 'Please enter a website URL first.', false);
        return;
      }
      if (!url) {
        showError('Invalid URL', 'Please enter a valid website address that starts with http:// or https://.', false);
        return;
      }

      hideHint();

      try {
        if (officeReady && Office.context && Office.context.ui && Office.context.ui.displayDialogAsync) {
          closeActiveDialog();
          var bridge = new URL('dialog.html', location.href);
          bridge.searchParams.set('url', url);

          Office.context.ui.displayDialogAsync(bridge.href, {
            width: 80,
            height: 80,
            promptBeforeOpen: false
          }, function (result) {
            if (result.status === Office.AsyncResultStatus.Failed) {
              console.warn('Dialog API failed:', result.error && result.error.code, result.error && result.error.message);
              // We are no longer inside the click, so a popup would be blocked:
              // show a link the user can click instead.
              showOpenLink(url);
              return;
            }
            activeDialog = result.value;
            activeDialog.addEventHandler(Office.EventType.DialogEventReceived, function () {
              activeDialog = null; // closed by the user
            });
          });
          return;
        }
      } catch (e) {
        console.warn('Dialog API not available:', e);
      }

      // Outside Office: still inside the click, so a normal popup is allowed
      var win = window.open(url, '_blank');
      if (win) {
        win.opener = null;
      } else {
        showOpenLink(url);
      }
    }

    function closeActiveDialog() {
      if (!activeDialog) return;
      try { activeDialog.close(); } catch (e) { /* already closed */ }
      activeDialog = null;
    }

    // ─── Load timeout detection ───────────────────────────
    function startLoadTimeout() {
      clearTimeout(loadTimeoutId);

      loadTimeoutId = setTimeout(function () {
        // Still loading after the timeout: slow network, or the site may block framing
        if (loading.classList.contains('active')) {
          showError(
            'Website did not load',
            'The website is taking too long or may be blocking embedded display.' +
            (isOnline ? ' This is common in PowerPoint Online.' : ''),
            true
          );
        }
      }, isOnline ? 12000 : 15000); // Shorter timeout for Online since it's more likely to fail
    }

    // ─── Save URL to Office settings ──────────────────────
    // Note: the URL is stored inside the presentation file.
    function saveUrl(url) {
      saveSetting('webViewerUrl', url);
    }

    function saveSetting(name, value) {
      try {
        if (officeReady && Office.context && Office.context.document && Office.context.document.settings) {
          if (value === null) Office.context.document.settings.remove(name);
          else Office.context.document.settings.set(name, value);
          Office.context.document.settings.saveAsync(function (result) {
            if (result.status === Office.AsyncResultStatus.Failed) {
              console.warn('Could not save ' + name + ' in the presentation:', result.error && result.error.message);
            }
          });
        }
      } catch (e) {
        // Silent: Office API not available (standalone/testing mode)
      }
    }

    // ─── Load URL typed by the user ───────────────────────
    function loadUrl() {
      var typed = urlInput.value.trim();

      if (!typed) {
        showError('Empty URL', 'Please enter a website URL to load.', false);
        return;
      }

      var pageUrl = UrlTools.safeUrl(typed);
      if (!pageUrl) {
        showError('Invalid URL', 'Please enter a valid website address that starts with http:// or https://.', false);
        return;
      }

      // Show the normalized URL the user typed
      urlInput.value = pageUrl;

      // YouTube / Vimeo links become their embeddable player URL
      setCurrentUrl(pageUrl);
      startFrameLoad();

      // Save the URL the user typed (re-converted when reloaded)
      saveUrl(pageUrl);
    }

    // ─── Handle iframe load events ────────────────────────
    webFrame.addEventListener('load', function () {
      if (!currentUrl) return; // initial empty frame

      clearTimeout(loadTimeoutId);
      loading.classList.remove('active');

      // Check if iframe actually loaded content (blank page detection)
      try {
        // Readable only for same-origin pages; cross-origin sites throw (normal case)
        var doc = webFrame.contentDocument;
        if (doc && doc.body) {
          var bodyContent = doc.body.innerHTML;
          if (!bodyContent || bodyContent.trim() === '') {
            showError(
              'Website appears blank',
              'The website loaded but shows no content. It may be blocking embedded display.',
              true
            );
            return;
          }
        }
      } catch (e) {
        // Cross-origin: the site loaded from a different domain (expected)
      }

      overlay.classList.add('hidden');
      branding.classList.add('hidden');
      scheduleHint();
    });

    // ─── Handle iframe errors ─────────────────────────────
    webFrame.addEventListener('error', function () {
      clearTimeout(loadTimeoutId);
      showError(
        'Could not load website',
        'This website may block being embedded in frames, or there may be a connection issue.',
        true
      );
    });

    // ─── Pointer: arrow or laser dot to point things out ──
    // Turned on with the pointer button. A see-through layer then lies over
    // the website and the mouse shows as the chosen arrow or laser dot, like
    // PowerPoint's own laser pointer: clicks point, they don't click the
    // website. Scrolling still reaches the website where the browser allows
    // it (pages on the same site as the viewer). Type and size are saved
    // per slide; the pointer itself always starts off.
    var pointerOn = false;
    var btnPointer = document.getElementById('btnPointer');
    var pointerType = document.getElementById('pointerType');
    var pointerSize = document.getElementById('pointerSize');
    var pointerLayer = document.getElementById('pointerLayer');
    var pointerMark = document.getElementById('pointerMark');
    var POINTER_COLORS = {
      'arrow-white':  { fill: '#ffffff', stroke: '#1b1b1b' },
      'arrow-yellow': { fill: '#ffd400', stroke: '#1b1b1b' },
      'arrow-blue':   { fill: '#1e6fd9', stroke: '#ffffff' },
      'arrow-red':    { fill: '#e0262e', stroke: '#ffffff' },
      'laser-red':    { core: '#ffe5e5', glow: '255, 40, 40' },
      'laser-green':  { core: '#e8ffe8', glow: '40, 230, 70' }
    };

    // Small picture of a pointer, used on the on/off button and in the menu
    function pointerIcon(type) {
      var c = POINTER_COLORS[type] || POINTER_COLORS['arrow-white'];
      if (type.indexOf('laser') === 0) {
        var id = 'g' + type.replace(/\W/g, '') + Math.random().toString(36).slice(2, 7);
        return '<svg viewBox="0 0 24 24" aria-hidden="true"><defs><radialGradient id="' + id + '">' +
          '<stop offset="0" stop-color="' + c.core + '"/><stop offset="0.45" stop-color="rgb(' + c.glow + ')"/>' +
          '<stop offset="1" stop-color="rgb(' + c.glow + ')" stop-opacity="0"/></radialGradient></defs>' +
          '<circle cx="12" cy="12" r="10" fill="url(#' + id + ')"/></svg>';
      }
      return '<svg viewBox="0 0 18 25" aria-hidden="true"><path d="M1.5 1.5 L1.5 20.5 L6.2 16.4 L9.3 23.2 L12.6 21.7 L9.6 15.1 L15.8 15.1 Z" fill="' +
        c.fill + '" stroke="' + c.stroke + '" stroke-width="1.6" stroke-linejoin="round"/></svg>';
    }

    var pointerMenu = document.getElementById('pointerMenu');
    var btnPointerMenu = document.getElementById('btnPointerMenu');

    function buildPointerMenu() {
      pointerMenu.textContent = '';
      [].forEach.call(pointerType.options, function (o) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'ptr-opt';
        b.setAttribute('role', 'option');
        b.setAttribute('aria-selected', o.value === pointerType.value ? 'true' : 'false');
        b.title = o.textContent;
        b.setAttribute('aria-label', o.textContent);
        b.innerHTML = pointerIcon(o.value);     // fixed pictures made above
        b.addEventListener('click', function (e) {
          e.stopPropagation();
          pointerType.value = o.value;
          pointerChanged();
          if (!pointerOn) setPointer(true);    // picking a pointer switches it on
          // the menu stays open: mark the new choice
          [].forEach.call(pointerMenu.querySelectorAll('.ptr-opt'), function (x) { x.setAttribute('aria-selected', x === b ? 'true' : 'false'); });
        });
        pointerMenu.appendChild(b);
      });
      // The size, also here so it can be set from the small bar
      var row = document.createElement('label');
      row.className = 'ptr-size-row';
      row.appendChild(document.createTextNode('Size'));
      var sel = document.createElement('select');
      sel.className = 'bar-select pointer-size';
      sel.setAttribute('aria-label', 'Pointer size in points');
      [].forEach.call(pointerSize.options, function (o) {
        var c = document.createElement('option');
        c.value = o.value;
        c.textContent = o.textContent + ' pt';
        sel.appendChild(c);
      });
      sel.value = pointerSize.value;
      sel.addEventListener('click', function (e) { e.stopPropagation(); });
      sel.addEventListener('change', function () { pointerSize.value = sel.value; pointerChanged(); });
      row.appendChild(sel);
      pointerMenu.appendChild(row);
    }

    function togglePointerMenu(e) {
      if (e) e.stopPropagation();
      if (!pointerMenu.hidden) { closePointerMenu(); return; }
      buildPointerMenu();
      pointerMenu.hidden = false;
      btnPointerMenu.setAttribute('aria-expanded', 'true');
      // open upwards when the bar sits low in the box
      pointerMenu.classList.remove('up', 'to-left');
      var m = pointerMenu.getBoundingClientRect(), box = appWrapper.getBoundingClientRect();
      if (m.bottom > box.bottom) pointerMenu.classList.add('up');
      if (m.right > box.right - 4) pointerMenu.classList.add('to-left');   // open towards the left near the edge
    }

    function closePointerMenu() {
      pointerMenu.hidden = true;
      btnPointerMenu.setAttribute('aria-expanded', 'false');
    }

    document.addEventListener('click', function (e) {
      if (!pointerMenu.hidden && !document.getElementById('pointerGroup').contains(e.target)) closePointerMenu();
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePointerMenu(); });

    function drawPointer() {
      btnPointer.innerHTML = pointerIcon(pointerType.value);   // show the chosen pointer on the button
      var type = pointerType.value;
      var pt = parseInt(pointerSize.value, 10) || 12;
      var c = POINTER_COLORS[type] || POINTER_COLORS['arrow-white'];
      var px = pt * 4 / 3;                       // points to pixels, as in Word
      if (type.indexOf('laser') === 0) {
        var d = Math.round(px);                  // dot diameter = the point size
        pointerMark.className = 'laser' + (pointerMark.classList.contains('shown') ? ' shown' : '');
        pointerMark.innerHTML = '';
        pointerMark.style.width = d + 'px';
        pointerMark.style.height = d + 'px';
        pointerMark.style.background = 'radial-gradient(circle, ' + c.core + ' 0%, rgb(' + c.glow + ') 45%, rgba(' + c.glow + ', 0.35) 75%, rgba(' + c.glow + ', 0) 100%)';
        pointerMark.style.boxShadow = '0 0 ' + Math.round(d * 0.6) + 'px ' + Math.round(d * 0.25) + 'px rgba(' + c.glow + ', 0.55)';
        pointerMark.dataset.hotX = pointerMark.dataset.hotY = String(d / 2);   // centre of the dot
      } else {
        var h = Math.round(px * 2);              // arrow height: twice the point size
        var w = Math.round(h * 0.72);
        pointerMark.className = pointerMark.classList.contains('shown') ? 'shown' : '';
        pointerMark.style.width = w + 'px';
        pointerMark.style.height = h + 'px';
        pointerMark.style.background = 'none';
        pointerMark.style.boxShadow = 'none';
        pointerMark.innerHTML = '<svg viewBox="0 0 18 25"><path d="M1.5 1.5 L1.5 20.5 L6.2 16.4 L9.3 23.2 L12.6 21.7 L9.6 15.1 L15.8 15.1 Z" fill="' + c.fill + '" stroke="' + c.stroke + '" stroke-width="1.6" stroke-linejoin="round"/></svg>';
        pointerMark.dataset.hotX = String(w * 1.5 / 18);                     // tip of the arrow
        pointerMark.dataset.hotY = String(h * 1.5 / 25);
      }
    }

    function movePointerTo(clientX, clientY) {
      var box = appWrapper.getBoundingClientRect();
      var x = clientX - box.left - parseFloat(pointerMark.dataset.hotX || 0);
      var y = clientY - box.top - parseFloat(pointerMark.dataset.hotY || 0);
      pointerMark.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
      pointerMark.classList.add('shown');
    }

    function movePointer(e) { movePointerTo(e.clientX, e.clientY); }

    // ─── Pointer + clicking the website ───────────────────
    // Where the website is on the same site as the viewer, the
    // pointer follows the mouse inside the website itself, so no layer is
    // needed and every click reaches the link under the pointer. For other
    // websites the browser hides the mouse from us, so the see-through layer
    // stays; hold ⌥ Option (Alt) to let a click through to the website.
    var hookedDoc = null;
    var CURSOR_STYLE_ID = '__viewer_pointer_cursor';

    function onFrameMove(e) {
      if (!pointerOn) return;
      var r = webFrame.getBoundingClientRect();
      var scale = r.width / (webFrame.offsetWidth || r.width);   // desktop-layout zoom
      movePointerTo(r.left + e.clientX * scale, r.top + e.clientY * scale);
    }

    function onFrameOut(e) {
      if (!e.relatedTarget) pointerMark.classList.remove('shown');   // mouse left the website
    }

    function hookFrame() {
      var d = null;
      try { d = webFrame.contentDocument; } catch (err) { d = null; }
      var same = !!(d && d.documentElement && currentUrl);
      pointerLayer.classList.toggle('through', pointerOn && same);
      if (!same) return;
      if (d !== hookedDoc) {
        hookedDoc = d;
        d.addEventListener('pointermove', onFrameMove, true);
        d.addEventListener('pointerdown', onFrameMove, true);
        d.addEventListener('mouseout', onFrameOut, true);
        d.addEventListener('pointerdown', onFrameClick, true);
      }
      var st = d.getElementById(CURSOR_STYLE_ID);
      if (pointerOn && !st) {
        st = d.createElement('style');
        st.id = CURSOR_STYLE_ID;
        st.textContent = '*, *::before, *::after { cursor: none !important; }';
        (d.head || d.documentElement).appendChild(st);
      } else if (!pointerOn && st) {
        st.remove();
      }
    }

    function setPointer(on) {
      pointerOn = !!on;
      document.body.classList.toggle('pointer-on', pointerOn);
      btnPointer.classList.toggle('active', pointerOn);
      btnPointer.setAttribute('aria-pressed', pointerOn ? 'true' : 'false');
      if (!pointerOn) pointerMark.classList.remove('shown');
      drawPointer();
      hookFrame();
    }

    // Each new page in the frame: hook it again (and hide its own cursor)
    webFrame.addEventListener('load', function () { if (pointerOn) hookFrame(); });

    // Other websites: hold ⌥ Option / Alt to click through the pointer layer
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Alt' && pointerOn && !pointerLayer.classList.contains('through')) {
        pointerLayer.classList.add('alt-through');
        pointerMark.classList.remove('shown');
      }
    });
    document.addEventListener('keyup', function (e) {
      if (e.key === 'Alt') pointerLayer.classList.remove('alt-through');
    });
    // The click lands in the website, which takes the keyboard: restore the layer
    window.addEventListener('blur', function () {
      setTimeout(function () { pointerLayer.classList.remove('alt-through'); }, 250);
    });

    function togglePointer() { setPointer(!pointerOn); }

    function pointerChanged() {
      drawPointer();
      saveSetting('webViewerPointer', JSON.stringify({ type: pointerType.value, size: pointerSize.value }));
    }

    function restorePointer(value) {
      try {
        var p = typeof value === 'string' ? JSON.parse(value) : null;
        if (p && POINTER_COLORS[p.type]) pointerType.value = p.type;
        if (p && [].some.call(pointerSize.options, function (o) { return o.value === String(p.size); })) pointerSize.value = String(p.size);
      } catch (e) { /* keep the defaults */ }
      drawPointer();
    }

    pointerLayer.addEventListener('pointermove', movePointer);
    pointerLayer.addEventListener('pointerdown', movePointer);

    // While presenting, a click with the pointer on shows the next animated line,
    // like clicking the text itself, wherever you click (⌥ Option-click still
    // reaches the website). On same-site pages links and buttons keep working.
    function pointerClickReveal(e) {
      if (!pointerOn || !presenting || textOn || e.button !== 0 || e.altKey) return false;
      if (!pointerMenu.hidden) return false;     // this click only closes the pointer menu
      if (!revealNext()) return false;
      grabKeyboard();
      return true;
    }
    pointerLayer.addEventListener('pointerdown', function (e) {
      var xb = e.button === 0 ? xBoxAt(e.clientX, e.clientY) : null;
      if (xb) { e.preventDefault(); removeBox(xb); return; }     // the × of a text box
      if (pointerClickReveal(e)) e.preventDefault();
    });
    pointerLayer.addEventListener('pointermove', function (e) {
      var xb = xBoxAt(e.clientX, e.clientY);
      boxes.forEach(function (b) { b.el.classList.toggle('show-x', b === xb); });
    });
    function onFrameClick(e) {
      var t = e.target;
      if (t && t.closest && t.closest('a, button, input, select, textarea, label, summary, [role="button"], [role="link"], [contenteditable="true"]')) return;
      if (pointerClickReveal(e)) { e.preventDefault(); e.stopPropagation(); }
    }
    pointerLayer.addEventListener('pointerleave', function () { pointerMark.classList.remove('shown'); });
    // Let the mouse wheel still scroll the website (same-site pages only)
    pointerLayer.addEventListener('wheel', function (e) {
      try {
        var scale = zoomEnabled ? (appWrapper.clientWidth / ZOOM_WIDTH) : 1;
        webFrame.contentWindow.scrollBy(e.deltaX / scale, e.deltaY / scale);
        e.preventDefault();
      } catch (err) { /* another website: the browser does not allow it */ }
    }, { passive: false });
    drawPointer();

    // ─── Back / forward ───────────────────────────────────
    // Two ways to keep the history, depending on what the browser allows:
    // • Pages on the same site as the viewer: the viewer sees every
    //   page you open, keeps its own list and goes back/forward exactly.
    //   Locked (linked) slides share that list, so ‹ on a later slide goes
    //   back through pages visited on an earlier one. Sign-in pages and URLs
    //   with secrets are never kept (isShareablePage).
    // • Other websites: the viewer can't see their pages, so it uses the
    //   browser's own history and counts page loads to know when ‹ or › can
    //   work. Buttons that can't do anything are greyed out.
    var btnBack = document.getElementById('btnBack');
    var btnFwd = document.getElementById('btnFwd');
    var HIST_PREFIX = 'webviewer.hist.';
    var HIST_MAX = 100;
    var hist = { list: [], idx: -1 };          // same-site pages
    var histTarget = null;                     // page we are going back/forward to
    var bh = { pos: -1, max: -1, dir: null };  // other websites: browser history

    function readablePage() {
      try {
        var href = String(webFrame.contentWindow.location.href);
        if (!href || href.indexOf('about:') === 0) return null;
        return UrlTools.siteUrl ? UrlTools.siteUrl(href) : UrlTools.safeUrl(href);
      } catch (e) {
        return null;                           // another website: not readable
      }
    }

    function keepable(url) {
      return typeof UrlTools.isShareablePage === 'function' ? UrlTools.isShareablePage(url) : true;
    }

    function histKey() {
      return (typeof linkId !== 'undefined' && linkId) ? HIST_PREFIX + linkId : null;
    }

    function loadHist() {
      var key = histKey();
      if (!key) return;
      try {
        var s = JSON.parse(localStorage.getItem(key) || 'null');
        if (s && Array.isArray(s.list)) {
          var list = s.list.map(String).filter(function (u) { return UrlTools.safeUrl(u) && keepable(u); });
          hist = { list: list, idx: Math.min(Math.max(0, s.idx | 0), list.length - 1) };
        }
      } catch (e) { /* keep what we have */ }
    }

    function saveHist() {
      var key = histKey();
      if (!key) return;
      try { localStorage.setItem(key, JSON.stringify(hist)); } catch (e) { /* storage unavailable */ }
    }

    // Note the page now shown in the frame (same-site pages only)
    function recordPage() {
      var page = readablePage();
      if (!page) return false;
      loadHist();
      if (hist.list[hist.idx] === page) { histTarget = null; return true; }
      if (histTarget && page === histTarget) { histTarget = null; return true; }
      histTarget = null;
      if (!keepable(page)) return true;
      hist.list = hist.list.slice(0, hist.idx + 1);
      hist.list.push(page);
      if (hist.list.length > HIST_MAX) hist.list.shift();
      hist.idx = hist.list.length - 1;
      saveHist();
      if (document.activeElement !== urlInput) urlInput.value = page;
      return true;
    }

    function sameSiteMode() {
      return !!readablePage() || (!!histKey() && hist.list.length > 0);
    }

    function renderHist() {
      var canBack, canFwd;
      if (sameSiteMode()) {
        loadHist();
        canBack = hist.idx > 0;
        canFwd = hist.idx >= 0 && hist.idx < hist.list.length - 1;
      } else {
        canBack = bh.pos > 0;
        canFwd = bh.pos >= 0 && bh.pos < bh.max;
      }
      btnBack.disabled = !canBack;
      btnFwd.disabled = !canFwd;
    }

    function openHistPage(url) {
      histTarget = url;
      urlInput.value = url;
      setCurrentUrl(url);
      startFrameLoad();
      saveUrl(url);
    }

    function goBack() {
      if (sameSiteMode()) {
        loadHist();
        if (hist.idx <= 0) return;
        hist.idx--;
        saveHist();
        openHistPage(hist.list[hist.idx]);
      } else if (bh.pos > 0) {
        bh.dir = 'back';
        history.back();
      }
      renderHist();
    }

    function goForward() {
      if (sameSiteMode()) {
        loadHist();
        if (hist.idx >= hist.list.length - 1) return;
        hist.idx++;
        saveHist();
        openHistPage(hist.list[hist.idx]);
      } else if (bh.pos < bh.max) {
        bh.dir = 'forward';
        history.forward();
      }
      renderHist();
    }

    webFrame.addEventListener('load', function () {
      if (!currentUrl) return;
      if (!recordPage()) {
        // Another website: count browser-history steps
        if (bh.dir === 'back') bh.pos = Math.max(0, bh.pos - 1);
        else if (bh.dir === 'forward') bh.pos = Math.min(bh.max, bh.pos + 1);
        else { bh.pos++; bh.max = bh.pos; }
        bh.dir = null;
      }
      renderHist();
    });

    // Pages that change without a full load (single-page apps), and history
    // updates made by a linked slide elsewhere
    setInterval(function () { if (currentUrl && recordPage()) renderHist(); }, 1000);
    window.addEventListener('storage', function (e) {
      if (e.key && e.key.indexOf(HIST_PREFIX) === 0) renderHist();
    });

    // ─── Text boxes ───────────────────────────────────────
    // The T button opens a text toolbar. With "new text box" on, drag on the
    // website to draw a box. Like PowerPoint: drag a box to move it, drag its
    // round handles to resize, click in it to type, Delete removes a selected
    // box, Esc stops typing. Each line is a list item when a list style is
    // chosen; an empty line has no mark. "Animate" shows the items one by one

      b.setAttribute('data-ord', oa);
      renumberSteps();
      saveText();
    }

    function removeStep(s) {
      s.line.removeAttribute('data-fx');
      s.line.removeAttribute('data-ord');
      renumberSteps();
      syncAnimButton();
      saveText();
    }

    // ── saving per slide ──
    function textJson() {
      var list = boxes.map(function (b) {
        var d = b.data;
        return { x: +d.x.toFixed(4), y: +d.y.toFixed(4), w: +d.w.toFixed(4), h: +d.h.toFixed(4), radius: +(d.radius || 0).toFixed(4), bg: d.bg, alpha: d.alpha,
                 font: d.font, pt: d.pt, color: d.color, list: d.list, anim: d.anim, html: cleanHtml(b.text.innerHTML).innerHTML };
      });
      return list.length ? JSON.stringify(list) : '';
    }

    function saveText() {
      clearTimeout(textSaveTimer);
      textSaveTimer = setTimeout(function () {
        var json = textJson();
        saveSetting('webViewerText', json || null);
        if (typeof shareTextBoxes === 'function') shareTextBoxes(json);
      }, 400);
    }

    function restoreText(value) {
      try {
        var list = typeof value === 'string' ? JSON.parse(value) : null;
        if (!Array.isArray(list)) return;
        restoringText = true;      // keep the saved order while the boxes come back one by one
        try { list.slice(0, 50).forEach(function (d) { if (d && typeof d === 'object') makeBox(d, d.html); }); }
        finally { restoringText = false; }
        renumberSteps();
        resetAnimations(presenting && !textOn);
        if (presenting) grabKeyboard();
      } catch (e) { /* unreadable: start without boxes */ }
    }

    // While presenting, ask for the keyboard so → and ← reach the viewer and go
    // through the animations before the slide changes. PowerPoint may keep the
    // keyboard for itself; then one click on the slide hands it over.
    function grabKeyboard() {
      // Only on slides with animated lines: elsewhere PowerPoint keeps the
      // keyboard, so Esc (end the show) reaches it straight away.
      if (!animSteps().length) return;
      try { window.focus(); } catch (e) {}
      try { document.getElementById('keyCatcher').focus({ preventScroll: true }); } catch (e) {}
    }
    document.addEventListener('pointerdown', function (e) {
      if (presenting && !isTyping(e.target)) setTimeout(grabKeyboard, 0);
    }, true);

    if (window.ResizeObserver) new ResizeObserver(function () { updateTextScale(); positionTextBar(); boxes.forEach(function (b) { applyBoxStyle(b); }); }).observe(appWrapper);
    window.addEventListener('resize', function () { updateTextScale(); positionTextBar(); });
    setInterval(positionTextBar, 250);        // follow the control bar when it is dragged
    updateTextScale();

    // ─── Changing slides (keys and the lower-left buttons) ─
    function goSlide(dir) {
      // While presenting, → first shows the next animated list item, ← hides the last one
      if (dir === 'next' && revealNext()) return true;
      if (dir === 'previous' && revealBack()) return true;
      if (typeof handOffPart === 'function') handOffPart(dir);
      try {
        var doc = officeReady && Office.context && Office.context.document;
        if (!doc || typeof doc.goToByIdAsync !== 'function') return false;
        var index = Office.Index || { Next: 'next', Previous: 'previous' };
        var goToType = Office.GoToType || { Index: 'index' };
        doc.goToByIdAsync(
          dir === 'next' ? index.Next : index.Previous,
          goToType.Index,
          function (result) {
            if (result && result.status === 'failed') {
              console.warn('Could not change slide:', result.error && result.error.message);
            }
          }
        );
        return true;
      } catch (err) {
        console.warn('Could not change slide:', err);
        return false;
      }
    }

    // ─── Present mode: hide the browser controls ─────────
    // PowerPoint reports 'read' while presenting (slideshow) and 'edit' while
    // editing. Entering present mode hides the control bar; leaving it shows
    // the bar again if it was hidden that way. The ⚙ in the top-right corner
    // always works, so even if a PowerPoint version reports the view wrongly,
    // the controls can be brought back by hand.
    var presenting = false;
    var autoHidden = false;      // the bar was hidden because present mode started
    var reportedView = '';       // what PowerPoint last reported, shown on the welcome screen

    function setPresenting(isPresenting) {
      isPresenting = !!isPresenting;
      if (isPresenting === presenting) return;
      presenting = isPresenting;
      document.body.classList.toggle('presenting', presenting);
      resetAnimations(presenting);          // animated list items start hidden while presenting
      if (presenting) setTextOn(false);
      if (presenting) grabKeyboard();
      if (presenting && typeof takeHandoff === 'function') takeHandoff(true);
      if (presenting) {
        hideHint();
        if (controlsVisible) {
          setControlsVisible(false);
          autoHidden = true;
        }
      } else if (autoHidden) {
        autoHidden = false;
        setControlsVisible(true);
      }
    }

    function noteView(view) {
      reportedView = String(view || '');
      if (!currentUrl) showWelcome();   // refresh the version line on the welcome screen
    }

    function watchPresentMode() {
      try {
        var doc = Office.context && Office.context.document;
        if (!doc) return;
        if (typeof doc.getActiveViewAsync === 'function') {
          doc.getActiveViewAsync(function (result) {
            if (result && result.status !== 'failed') { noteView(result.value); setPresenting(result.value === 'read'); }
          });
        }
        if (typeof doc.addHandlerAsync === 'function' && Office.EventType && Office.EventType.ActiveViewChanged) {
          doc.addHandlerAsync(Office.EventType.ActiveViewChanged, function (e) {
            noteView(e && e.activeView);
            setPresenting(e && e.activeView === 'read');
          });
        }
      } catch (err) {
        // Older hosts without view information: controls behave as before
      }
    }

    // ─── Slide keys: pass → ← Page Down / Page Up on to PowerPoint ───
    // Once you click inside the box, the keyboard belongs to the add-in and
    // PowerPoint never sees the keys, so the slides stop advancing. These keys
    // are handed to PowerPoint's own "next / previous slide". ↑ and ↓ are left
    // alone so they still scroll the website, nothing is passed on while you
    // type in a field, and keys a website handles itself are left to it.
    // Where the website is on the same site as the viewer, keys
    // pressed inside the website are caught too; for other websites the
    // browser only lets us see keys pressed on the viewer's own controls.
    var SLIDE_KEYS = { ArrowRight: 'next', PageDown: 'next', ArrowLeft: 'previous', PageUp: 'previous' };
    // While presenting, PowerPoint's other "next / previous" keys work too
    var SHOW_KEYS = { ' ': 'next', Enter: 'next', n: 'next', N: 'next', p: 'previous', P: 'previous', Backspace: 'previous' };

    function isTyping(el) {
      return !!el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName || ''));
    }

    function handleSlideKey(e) {
      var dir = SLIDE_KEYS[e.key];
      if (!dir && presenting && SHOW_KEYS[e.key] && !(e.target && e.target.closest && e.target.closest('a, button'))) dir = SHOW_KEYS[e.key];
      if (!dir || e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
      if (isTyping(e.target)) return;
      if (goSlide(dir)) e.preventDefault();
    }

    document.addEventListener('keydown', handleSlideKey);

    // Same-site pages only: listen inside the website as well (each page load)
    webFrame.addEventListener('load', function () {
      try {
        var d = webFrame.contentDocument;
        if (d && !d.__slideKeys) {
          d.addEventListener('keydown', handleSlideKey);
          d.__slideKeys = true;
        }
      } catch (err) {
        // Another website: the browser does not let us listen inside it
      }
    });

    // ─── Enter key to load ────────────────────────────────
    urlInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        loadUrl();
      }
    });

    // Show the welcome screen right away (updated once Office is ready)
    showWelcome();

    // ─── Initialize with Office.js ────────────────────────
    Office.onReady(function () {
      officeReady = true;
      watchPresentMode();

      // Detect environment
      detectEnvironment();

      // Update welcome screen with environment-specific tips
      if (!currentUrl) {
        showWelcome();
      }

      // Load the URL saved for this slide. It comes from the presentation
      // file, which anyone can edit, so it goes through the same safety
      // check as a typed URL.
      try {
        if (Office.context && Office.context.document && Office.context.document.settings) {
          // Zoom choice for this slide (desktop layout is the default)
          zoomEnabled = Office.context.document.settings.get('webViewerZoom') !== 'native';
          applyZoom();

          // Where this slide's controls were dragged to (top-right corner if never moved)
          restoreBarPos(Office.context.document.settings.get('webViewerBarPos'));
          restoreBarPos(Office.context.document.settings.get('webViewerBarPosSmall'), true);
          setCompact(Office.context.document.settings.get('webViewerCompact') === true, true);

          // This slide's pointer type and size
          restorePointer(Office.context.document.settings.get('webViewerPointer'));

          // This slide's text boxes
          restoreText(Office.context.document.settings.get('webViewerText'));

          var savedUrl = Office.context.document.settings.get('webViewerUrl');
          if (savedUrl) {
            var pageUrl = UrlTools.safeUrl(String(savedUrl));
            if (pageUrl) {
              urlInput.value = pageUrl;
              setCurrentUrl(pageUrl);
              startFrameLoad();
            } else {
              showError(
                'Saved link not opened',
                'This slide contains a saved link that is not a normal website address, so it was not opened for your safety. Enter a new URL above.',
                false
              );
            }
          }
        }
      } catch (e) {
        // Silent: Office API not available (standalone/testing mode)
      }
    });
  </script>
</body>
</html>
